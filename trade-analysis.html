<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let C=[],A=null,V=120,timer=0,tool='c',pend=null,ms=null,G={},D=[],HI=[],R={};
const KB=[
[/market structure|\bhh\b|\bhl\b|higher high|trend/,'Market structure: an uptrend makes higher highs (HH) and higher lows (HL); a downtrend makes lower highs (LH) and lower lows (LL). The trend stays valid until structure breaks.'],
[/\bbos\b|choch|\bmss\b|break of structure|change of character/,'BOS (break of structure): a candle closes beyond the last swing in the trend direction, so the trend continues. CHoCH or MSS: a close beyond the last swing against the trend, the first sign of reversal.'],
[/order block|\bob\b/,'Order block (OB): the last opposite candle before an impulsive move that breaks structure. A bullish OB is the last down candle (demand), a bearish OB the last up candle (supply). It stays valid until price closes through it (mitigation).'],
[/supply|demand/,'Supply and demand zones are areas price left sharply, showing unfilled orders. Fresh zones react best, and each retest weakens them.'],
[/\bfvg\b|fair value|imbalance|gap/,'Fair value gap (FVG): a 3-candle pattern where the wicks of candle 1 and candle 3 do not overlap, leaving an imbalance. Price often returns to fill it or reacts inside it. Its 50% level is called consequent encroachment.'],
[/ifvg|inverse/,'Inverse FVG (iFVG): an FVG that price closes through. It flips role, so old support becomes resistance.'],
[/breaker/,'Breaker block: a failed order block. After price sweeps liquidity and breaks structure through an OB, that OB flips polarity and is retested as support or resistance.'],
[/mitigation|propulsion/,'Mitigation block: the zone where a swing failed to make a new high or low before a structure shift, retested later. Propulsion block: an OB candle that forms in or after another OB and pushes price onward.'],
[/liquidity|stop hunt|sweep|equal high|equal low|\bbsl\b|\bssl\b/,'Liquidity: resting stop orders above highs (buy-side, BSL) and below lows (sell-side, SSL). Equal highs and lows are magnets. Price often sweeps them (a stop hunt) before reversing.'],
[/inducement/,'Inducement: a minor swing that lures traders into early entries. Smart money sweeps it before the real move.'],
[/premium|discount|equilibrium/,'Premium and discount: split a swing range at 50% (equilibrium). Above it is premium (look to sell), below it is discount (look to buy).'],
[/\bote\b|optimal trade|fib/,'Optimal trade entry (OTE): a retracement of 62% to 79% of the impulse leg (70.5% is the sweet spot), ideally overlapping an OB or FVG.'],
[/displacement/,'Displacement: strong, large-bodied candles that leave FVGs, showing institutional intent. It confirms a structure break.'],
[/power of 3|po3|\bamd\b|judas|manipulation|accumulation/,'Power of 3 (AMD): accumulation (range), manipulation (a Judas swing sweeps liquidity against the real move), then distribution (the true move). On a bullish day price sweeps below the open or Asian low, then rallies.'],
[/kill ?zone|session|london|asian|new york/,'Killzones (New York time, approximate): Asian 8pm to midnight, London 2am to 5am, New York AM 7am to 10am, New York PM 1:30pm to 4pm. Most sweeps and reversals happen in these windows.'],
[/silver bullet/,'Silver Bullet: one-hour windows (3 to 4am, 10 to 11am, 2 to 3pm New York). Trade the first FVG after a liquidity sweep toward the opposite liquidity.'],
[/top.?down|htf|higher timeframe|daily bias/,'Top-down: set bias on the daily or 4H (structure, previous day and week highs and lows, premium or discount), refine on 1H, and enter on 15m or 5m after a CHoCH into a zone.'],
[/pdh|pdl|previous day|key level|opening price/,'Key levels: previous day, week and month highs and lows, session highs and lows, and opening prices. They act as liquidity targets.'],
[/smt|divergence|correlat/,'SMT divergence: correlated markets (EURUSD and GBPUSD, or ES and NQ) fail to confirm each other\'s new high or low, hinting at a reversal.'],
[/\bamt\b|auction|value area|\bpoc\b|market profile|\bvah\b|\bval\b/,'Auction Market Theory (AMT): price auctions to find fair value, alternating between balance (range) and imbalance (trend). Value area is about 70% of volume, POC is the price with the most volume, and VAH and VAL are the value area edges.'],
[/hvn|lvn|initial balance|single print|acceptance|rejection/,'AMT use: acceptance outside value means trend continuation, and rejection back inside means a move to the other side of value. High-volume nodes act as magnets, low-volume nodes as fast-travel zones. Initial balance is the first-hour range, and single prints show strong initiative.'],
[/wyckoff|spring|utad/,'Wyckoff: accumulation (a spring below the range, then markup) and distribution (an upthrust above the range, then markdown) follow the same sweep-then-reverse logic as AMD.'],
[/risk|lot|position size|budget|balance/,'Risk: risk 0.5% to 2% of your balance per trade. Lots = (balance x risk%) / (SL distance x contract size x USD value per unit). Aim for 2R or more, and move stops only on structure.'],
[/model|setup|strategy|entry/,'Typical SMC model: higher-timeframe bias, liquidity sweep, CHoCH with displacement, retrace into an OB or FVG (discount for buys, premium for sells), SL beyond the zone, TP at the opposite liquidity.'],
[/confluence/,'Confluence beats single signals: trend alignment, a fresh zone, FVG overlap, killzone timing, a prior sweep and reward to risk of 2 or more. No setup is guaranteed, so skip trades without confluence.']];
function demo(){let s=Date.now()%2147483646+1;const r=()=>(s=(s*16807)%2147483647)/2147483647;let p=2300,d=1,out=[],t=Date.now()-300*9e5;
 for(let i=0;i<300;i++){if(i%40===0)d=r()<.5?1:-1;const v=3+r()*3,o=p,c=o+d*v*.3+(r()-.5)*v*2,h=Math.max(o,c)+r()*v*.8,l=Math.min(o,c)-r()*v*.8;out.push({t:new Date(t+i*9e5).toISOString().slice(0,16).replace('T',' '),o,h,l,c});p=c}return out}
function analyze(K){
 const n=K.length,N=3;if(n<30)return null;
 const H=K.map(k=>k.h),L=K.map(k=>k.l),px=K[n-1].c,dp=px>1000?2:px>20?3:5;
 let s=0;const m=14;for(let i=n-m;i<n;i++)s+=Math.max(K[i].h-K[i].l,Math.abs(K[i].h-K[i-1].c),Math.abs(K[i].l-K[i-1].c));const atr=s/m;
 const isH=i=>{for(let j=i-N;j<=i+N;j++){if(j<i&&H[j]>H[i])return 0;if(j>i&&H[j]>=H[i])return 0}return 1};
 const isL=i=>{for(let j=i-N;j<=i+N;j++){if(j<i&&L[j]<L[i])return 0;if(j>i&&L[j]<=L[i])return 0}return 1};
 const sw=[];for(let i=N;i<n-N;i++){if(isH(i))sw.push({i,p:H[i],k:'H'});if(isL(i))sw.push({i,p:L[i],k:'L'})}
 let ph=null,pl=null;for(const q of sw){if(q.k==='H'){q.lb=ph==null?'H':q.p>ph?'HH':'LH';ph=q.p}else{q.lb=pl==null?'L':q.p<pl?'LL':'HL';pl=q.p}}
 let tr=0,lh=null,ll=null;const ev=[];
 for(let i=0;i<n;i++){const k=i-N;if(k>=N){if(isH(k))lh={i:k,p:H[k],b:0};if(isL(k))ll={i:k,p:L[k],b:0}}
  if(lh&&!lh.b&&K[i].c>lh.p){lh.b=1;ev.push({i,f:lh.i,lvl:lh.p,d:1,type:tr<0?'CHoCH':'BOS'});tr=1}
  if(ll&&!ll.b&&K[i].c<ll.p){ll.b=1;ev.push({i,f:ll.i,lvl:ll.p,d:-1,type:tr>0?'CHoCH':'BOS'});tr=-1}}
 const obs=[];
 for(const e of ev){const d=e.d;let mi=e.f;for(let j=e.f;j<=e.i;j++)if(d>0?L[j]<L[mi]:H[j]>H[mi])mi=j;
  let o=-1;for(let j=mi;j>=Math.max(0,mi-5);j--)if(d>0?K[j].c<K[j].o:K[j].c>K[j].o){o=j;break}
  if(o<0)continue;const lo=L[o],hi=H[o];let mit=0;for(let j=e.i+1;j<n;j++)if(d>0?K[j].c<lo:K[j].c>hi){mit=1;break}
  if(!mit)obs.push({i:o,lo,hi,d})}
 const fv=[];
 for(let i=2;i<n;i++){const a=K[i-2],c=K[i];let g=null;
  if(c.l>a.h&&c.l-a.h>.1*atr)g={d:1,lo:a.h,hi:c.l};else if(c.h<a.l&&a.l-c.h>.1*atr)g={d:-1,lo:c.h,hi:a.l};
  if(!g)continue;let dead=0;for(let j=i+1;j<n;j++)if(g.d>0?L[j]<=g.lo:H[j]>=g.hi){dead=1;break}
  if(!dead)fv.push({...g,i:i-1})}
 const pools=sw.map(q=>{let sj=-1;for(let j=q.i+1;j<n;j++)if(q.k==='H'?H[j]>q.p:L[j]<q.p){sj=j;break}return{...q,sj,eq:0}});
 for(const a of pools)for(const b of pools)if(a!==b&&a.k===b.k&&Math.abs(a.p-b.p)<.15*atr)a.eq=1;
 const bsl=pools.filter(k=>k.k==='H'&&k.sj<0&&k.p>px).sort((a,b)=>a.p-b.p),ssl=pools.filter(k=>k.k==='L'&&k.sj<0&&k.p<px).sort((a,b)=>b.p-a.p);
 const rs=pools.filter(k=>k.sj>=n-25&&k.sj>0&&(k.k==='H'?K[k.sj].c<k.p:K[k.sj].c>k.p));
 const lH=[...sw].reverse().find(k=>k.k==='H'),lL=[...sw].reverse().find(k=>k.k==='L');
 let hi=lH?lH.p:Math.max(...H.slice(-60)),lo=lL?lL.p:Math.min(...L.slice(-60));if(hi<=lo){hi=Math.max(...H.slice(-60));lo=Math.min(...L.slice(-60))}
 const eq=(hi+lo)/2,zone=px>eq?'Premium':'Discount',lastEv=ev[ev.length-1];
 const tgt=(d,from)=>{const c=d<0?[...obs.filter(o=>o.d>0&&o.hi<from).map(o=>({p:o.hi,n:'demand zone'})),...ssl.filter(k=>k.p<from).map(k=>({p:k.p,n:'sell-side liquidity'}))].sort((a,b)=>b.p-a.p):[...obs.filter(o=>o.d<0&&o.lo>from).map(o=>({p:o.lo,n:'supply zone'})),...bsl.filter(k=>k.p>from).map(k=>({p:k.p,n:'buy-side liquidity'}))].sort((a,b)=>a.p-b.p);return c[0]||null};
 const sup=obs.filter(o=>o.d<0&&o.hi>px).sort((a,b)=>a.lo-b.lo)[0],dem=obs.filter(o=>o.d>0&&o.lo<px).sort((a,b)=>b.hi-a.hi)[0];
 const scn=[{d:-1,z:sup,t:sup&&tgt(-1,sup.lo)},{d:1,z:dem,t:dem&&tgt(1,dem.hi)}];
 function plan(d){
  const zs=[...obs.filter(o=>o.d===d).map(o=>({...o,kind:'Order Block',src:o})),...fv.filter(g=>g.d===d).map(g=>({...g,kind:'FVG',src:g}))].filter(z=>d>0?z.lo<px:z.hi>px);
  if(!zs.length)return null;zs.forEach(z=>z.dist=d>0?Math.max(0,px-z.hi):Math.max(0,z.lo-px));
  zs.sort((a,b)=>a.dist-b.dist||(a.kind==='FVG')-(b.kind==='FVG'));
  const z=zs[0],entry=z.dist===0?px:(z.lo+z.hi)/2,sl=d>0?z.lo-.25*atr:z.hi+.25*atr,risk=Math.abs(entry-sl);if(!(risk>0))return null;
  const cand=pools.filter(k=>k.sj<0&&(d>0?k.k==='H'&&k.p>entry:k.k==='L'&&k.p<entry)).map(k=>k.p).sort((a,b)=>d>0?a-b:b-a);
  let tp=cand.find(p=>Math.abs(p-entry)>=1.5*risk),tpl='liquidity target';if(tp==null){tp=entry+d*2*risk;tpl='2R, no liquidity target'}
  const rr=Math.abs(tp-entry)/risk,c=[],add=(ok,t,p)=>c.push({ok:!!ok,t,p});
  add(tr===d,'Trend aligned',2);add(true,z.kind==='Order Block'?(d>0?'At demand zone':'At supply zone'):'FVG entry only',z.kind==='Order Block'?2:1);
  add([...obs,...fv].some(o=>o.d===d&&o!==z.src&&o.lo<z.hi&&o.hi>z.lo),'OB and FVG overlap',1);
  add(d>0?entry<eq:entry>eq,d>0?'Entry in discount':'Entry in premium',1);
  add(rs.some(r=>r.k===(d>0?'L':'H')),'Opposite liquidity swept',1);add(lastEv&&lastEv.d===d,'Latest break supports it',1);add(rr>=2,'Reward to risk 2+',1);
  return{d,z,entry,sl,tp,tpl,rr,c,score:c.reduce((a,x)=>a+(x.ok?x.p:0),0)}}
 const dir=tr||(lastEv?lastEv.d:0),P={1:plan(1),'-1':plan(-1)};
 return{n,px,dp,atr,sw,ev,obs,fv,pools,bsl,ssl,rs,eq,hi,lo,zone,tr,scn,P,dir,p:dir?P[dir]:null,lH,lL}}
const F=(a,x)=>x.toFixed(a.dp);
function biasOf(a){
 const w=a.tr>0?'BULLISH':a.tr<0?'BEARISH':'RANGING',e=a.ev[a.ev.length-1];
 const adv=a.tr>0?(a.zone==='Discount'?'Price is in Discount, a good area to look for buys.':'Price is in Premium, wait for a pullback to Discount before buying.'):a.tr<0?(a.zone==='Premium'?'Price is in Premium, a good area to look for sells.':'Price is in Discount, wait for a pullback to Premium before selling.'):'No clear trend, avoid trading the middle of the range.';
 return{w,cls:a.tr>0?'up':a.tr<0?'dn':'',sub:(a.tr>0?'Higher highs and higher lows.':a.tr<0?'Lower highs and lower lows.':'Mixed structure.')+(e?` Last ${e.type} ${e.d>0?'up':'down'} at ${F(a,e.lvl)}.`:'')+' '+adv}}
function scnText(a,s){return s.z?`If price reaches the ${s.d<0?'SUPPLY':'DEMAND'} zone ${F(a,s.z.lo)} – ${F(a,s.z.hi)}, expect ${s.d<0?'sellers':'buyers'} to react and price to move ${s.d<0?'down':'up'} toward ${s.t?F(a,s.t.p)+' ('+s.t.n+')':'the next liquidity'}.`:`No fresh ${s.d<0?'supply above':'demand below'} the price right now.`}
function planText(a,d){const p=a.P[d],nm=d>0?'BUY':'SELL';if(!p)return `No valid ${nm} setup: there is no unmitigated ${d>0?'demand':'supply'} zone or FVG ${d>0?'below':'above'} price. Wait for a new structure break and retrace.`;
 return `${nm} idea at the ${p.z.kind==='Order Block'?(d>0?'DEMAND':'SUPPLY')+' (order block)':'FVG'} zone ${F(a,p.z.lo)} – ${F(a,p.z.hi)}\nEntry: ${F(a,p.entry)}\nStop loss: ${F(a,p.sl)}\nTake profit: ${F(a,p.tp)} (${p.tpl}), RR 1:${p.rr.toFixed(1)}\n${p.z.dist===0?'Price is inside the zone now. Wait for a rejection candle before entering.':'Wait for price to retrace into the zone, then look for a rejection.'}\nConfluence: ${p.score}/9`+(a.tr&&a.tr!==d?'\nCareful: this is against the main trend, so treat it as a short-term trade.':'')}
function answer(q){q=q.toLowerCase();const a=A;if(!a)return 'Connect a live feed first (Go live) or press Demo, then ask me again.';const m=r=>r.test(q),f=x=>F(a,x),b=biasOf(a);
 if(m(/\b(buy|long)\b/))return planText(a,1);if(m(/\b(sell|short)\b/))return planText(a,-1);
 if(m(/next|where.*(go|move)|target|will it/)&&!m(/\b(sl|stop)\b/))return a.scn.map(s=>scnText(a,s)).join('\n\n')+(a.p?`\n\nMain plan: ${a.p.d>0?'BUY':'SELL'}, target ${f(a.p.tp)}.`:'');
 if(m(/\b(sl|stop|tp|take profit|profit|loss)\b/))return a.p?planText(a,a.dir):'No clean trade plan right now. Wait for a retrace into a fresh zone.';
 if(m(/bias|trend|direction/))return `Bias: ${b.w}\n${b.sub}`;
 if(m(/structure|bos|choch|swing|break/))return `Structure is ${b.w.toLowerCase()}.\nRecent swings: ${a.sw.slice(-6).map(s=>s.lb).join(' › ')}\nRecent breaks: ${a.ev.slice(-3).map(e=>e.type+(e.d>0?' up':' down')+' at '+f(e.lvl)).join(', ')||'none'}`;

function offline(q){const l=q.toLowerCase();if(/what is|what are|explain|define|meaning|difference|how (does|do)|why/.test(l)){const h=KB.filter(e=>e[0].test(l));if(h.length)return h.slice(0,2).map(e=>e[1]).join('\n\n')}
 if(A&&/\blots?\b|size|budget|balance|how much/.test(l)){const sz=sizes(A,$('sym').value),sp=spec($('sym').value,A.px);return[1,-1].map(d=>{const p=A.P[d],s=sz[d];return p?`${d>0?'BUY':'SELL'}: entry ${F(A,p.entry)}, SL ${F(A,p.sl)}, TP ${F(A,p.tp)}. With ${$('bal').value} budget and ${$('rk').value}% risk, size is ${s.lot.toFixed(sp.u==='units'?4:2)} ${sp.u}, risking $${s.risk.toFixed(2)} to make about $${s.profit.toFixed(2)}.`:`${d>0?'BUY':'SELL'}: no valid zone now.`}).join('\n\n')}
 const h=KB.filter(e=>e[0].test(l));if(h.length&&!/bias|buy|sell|sl|tp|target|next/.test(l))return h[0][1];return answer(q)+'\n\n(Add a Claude API key under Keys for open-ended AI answers.)'}
